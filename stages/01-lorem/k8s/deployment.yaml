apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: ml-inference-student01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
    spec:
      containers:
        - name: inference-api
          image: inference-api:v1.0
          ports:
            - containerPort: 8000